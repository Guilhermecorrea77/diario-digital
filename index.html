<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Diário Digital do Professor</title>
    <meta name="description" content="Agenda diária do professor: aulas por período e turma, humor e hábitos, com resumo do mês.">
    <meta name="theme-color" content="#22473c">
    <script>
        try { var b = JSON.parse(localStorage.getItem('diarioDigital:v1') || 'null'); var t = b && b.config && b.config.tema; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header class="topo">
        <div class="topo-dentro">
            <span class="marca"><span class="selo" aria-hidden="true">📔</span>Diário</span>
            <nav class="abas abas-topo" id="abas-topo" aria-label="Seções"></nav>
            <div class="direita">
                <span class="salvo" id="salvo" aria-live="polite">✓ Salvo</span>
                <button type="button" class="tema-btn" id="btn-tema" aria-label="Trocar tema"></button>
            </div>
        </div>
    </header>
    <main class="pagina" id="app" tabindex="-1"></main>
    <nav class="abas abas-inf" id="abas-inf" aria-label="Seções"></nav>

    <dialog class="folha" id="folha" aria-labelledby="folha-titulo">
        <form method="dialog" id="folha-form">
            <div class="folha-corpo" id="folha-corpo"></div>
            <div class="folha-acoes" id="folha-acoes"></div>
        </form>
    </dialog>
    <div class="aviso-flut" id="aviso" role="status" aria-live="polite"></div>
    <div class="dica" id="dica" hidden></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
